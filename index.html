<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻雀・ポーカー成績記録</title>
<style>
  :root {
    --felt: #0f5132;
    --felt-dark: #0a3a24;
    --gold: #d4af37;
    --card-bg: #fbf7ee;
    --ink: #2b2b2b;
    --danger: #a83232;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(circle at top, var(--felt) 0%, var(--felt-dark) 100%);
    color: var(--ink);
    min-height: 100vh;
    padding: 16px;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    color: var(--gold);
    text-align: center;
    font-size: 1.4rem;
    letter-spacing: 0.05em;
    margin: 8px 0 16px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1;
    padding: 12px;
    border: 2px solid var(--gold);
    background: var(--felt-dark);
    color: var(--gold);
    font-size: 0.95rem;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn.active {
    background: var(--gold);
    color: var(--felt-dark);
  }
  .panel {
    display: none;
  }
  .panel.active {
    display: block;
  }
  .card {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    margin-bottom: 16px;
  }
  .card h2 {
    margin-top: 0;
    font-size: 1.1rem;
    color: var(--felt-dark);
    border-bottom: 2px solid var(--gold);
    padding-bottom: 6px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    margin-top: 10px;
    margin-bottom: 4px;
    color: #555;
  }
  input, select, textarea {
    width: 100%;
    padding: 10px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
    font-family: inherit;
  }
  textarea {
    resize: vertical;
  }
  .submit-btn {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    font-size: 1rem;
    font-weight: bold;
    background: var(--felt);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .submit-btn:active {
    background: var(--felt-dark);
  }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .stat-box {
    flex: 1 1 28%;
    min-width: 84px;
    background: var(--card-bg);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .stat-box .num {
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--felt-dark);
  }
  .stat-box .label {
    font-size: 0.72rem;
    color: #777;
  }
  .record-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .record-item {
    background: var(--card-bg);
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .record-info {
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .record-info .main-line {
    font-weight: bold;
  }
  .record-info .sub-line {
    color: #666;
    font-size: 0.8rem;
  }
  .rank-badge {
    display: inline-block;
    min-width: 28px;
    text-align: center;
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: bold;
    background: var(--gold);
    color: var(--felt-dark);
    margin-right: 6px;
  }
  .del-btn {
    background: var(--danger);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 0.85rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .empty-msg {
    color: #eee;
    text-align: center;
    padding: 20px;
    font-size: 0.9rem;
  }
  .chip-container {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
    padding: 4px 0;
  }
  .chip {
    padding: 7px 12px;
    border-radius: 16px;
    border: 1.5px solid var(--felt);
    background: #fff;
    color: var(--felt-dark);
    font-size: 0.85rem;
    cursor: pointer;
  }
  .chip.selected {
    background: var(--felt);
    color: #fff;
  }
  .group-card {
    background: var(--card-bg);
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    margin-bottom: 8px;
  }
  .group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    font-weight: bold;
    font-size: 0.85rem;
    color: var(--felt-dark);
    border-bottom: 1px solid var(--gold);
    padding-bottom: 6px;
    margin-bottom: 6px;
  }
  .round-row {
    padding: 6px 0;
    border-bottom: 1px dashed #ddd;
    font-size: 0.9rem;
  }
  .round-row:last-child {
    border-bottom: none;
  }
  .round-row .del-btn {
    margin-top: 6px;
  }
  .memo-line {
    color: #7a5a00;
    font-size: 0.8rem;
    font-style: italic;
    margin-top: 2px;
  }
  .rank-preview {
    margin-top: 10px;
    font-size: 0.95rem;
    font-weight: bold;
    color: var(--felt-dark);
  }
  .form-warning {
    margin-top: 6px;
    font-size: 0.8rem;
    color: var(--danger);
    min-height: 1.1em;
  }
  .search-box {
    margin-bottom: 12px;
  }
  .search-info {
    font-size: 0.78rem;
    color: #eee;
    padding: 0 2px;
    min-height: 1.1em;
  }
  .point-sum {
    margin-top: 8px;
    font-size: 0.95rem;
    font-weight: bold;
    color: var(--felt);
  }
  .point-sum.point-sum-warn {
    color: var(--danger);
  }
  .point-sum-note {
    font-size: 0.75rem;
    color: #888;
    margin-top: 2px;
  }
  .sort-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .compat-good {
    color: #1d4ed8;
  }
  .compat-bad {
    color: #b91c1c;
  }
  .chip.compat-good {
    color: #1d4ed8;
    border-color: #1d4ed8;
  }
  .chip.compat-bad {
    color: #b91c1c;
    border-color: #b91c1c;
  }
  .chip.selected.compat-good,
  .chip.selected.compat-bad {
    color: #fff;
  }
  .point-input-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .point-input-row input {
    flex: 1;
  }
  .sign-btn {
    flex: 0 0 auto;
    min-width: 44px;
    min-height: 44px;
    font-size: 1.1rem;
    font-weight: bold;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  .sign-btn.sign-btn-active {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>麻雀・ポーカー成績記録</h1>

  <div class="tabs">
    <button class="tab-btn active" id="tab-btn-mahjong" onclick="switchTab('mahjong')">麻雀</button>
    <button class="tab-btn" id="tab-btn-poker" onclick="switchTab('poker')">ポーカー</button>
    <button class="tab-btn" id="tab-btn-members" onclick="switchTab('members')">メンバー</button>
  </div>

  <!-- 麻雀パネル -->
  <div class="panel active" id="panel-mahjong">
    <div class="card">
      <h2>麻雀の記録を追加</h2>
      <form id="form-mahjong">
        <label for="mj-date">日付</label>
        <input type="date" id="mj-date" required>

        <label for="mj-event">大会名</label>
        <input type="text" id="mj-event" list="mj-event-list" placeholder="例：金曜フリー">
        <datalist id="mj-event-list"></datalist>

        <label>会場</label>
        <div class="chip-container" id="mj-venue-chips"></div>

        <label for="mj-tour-type">大会種別</label>
        <select id="mj-tour-type">
          <option value="">選択してください</option>
          <option value="リーグ戦">リーグ戦</option>
          <option value="ワンデー">ワンデー</option>
          <option value="セット">セット</option>
          <option value="オンライン">オンライン</option>
        </select>

        <label for="mj-round">回戦番号</label>
        <input type="number" id="mj-round" min="1" step="1" value="1" required>

        <label>対戦相手（3人を選択）</label>
        <div class="chip-container" id="mj-opponent-chips"></div>

        <label for="mj-point">自分の最終ポイント（ウマオカ込み）</label>
        <div class="point-input-row">
          <button type="button" class="sign-btn" id="mj-point-sign-btn" aria-label="符号を反転" onclick="toggleMjPointSign()">±</button>
          <input type="text" inputmode="decimal" id="mj-point" placeholder="例：-45.7" required>
        </div>

        <div id="mj-opponent-points"></div>

        <div id="mj-rank-preview" class="rank-preview">現在の順位：-</div>
        <div id="mj-point-sum" class="point-sum">合計：0.0</div>
        <div id="mj-point-sum-note" class="point-sum-note" style="display:none;">供託が残った場合を除き、通常は0になります</div>
        <div id="mj-form-warning" class="form-warning"></div>

        <label for="mj-memo">メモ（役満・チョンボなど）</label>
        <textarea id="mj-memo" rows="2" placeholder="自由に記入"></textarea>

        <button type="submit" class="submit-btn">記録する</button>
      </form>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="num" id="mj-stat-count">0</div>
        <div class="label">記録数</div>
      </div>
      <div class="stat-box">
        <div class="num" id="mj-stat-avg-rank">-</div>
        <div class="label">平均順位</div>
      </div>
      <div class="stat-box">
        <div class="num" id="mj-stat-avg-point">-</div>
        <div class="label">平均ポイント</div>
      </div>
      <div class="stat-box">
        <div class="num" id="mj-stat-top-rate">-</div>
        <div class="label">トップ率</div>
      </div>
      <div class="stat-box">
        <div class="num" id="mj-stat-rentai-rate">-</div>
        <div class="label">連対率</div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="mj-search" placeholder="キーワードで検索（大会名・会場・大会種別・メモ・対戦相手）">
      <div class="search-info" id="mj-search-info"></div>
    </div>

    <div class="sort-bar" id="mj-sort-bar">
      <button type="button" class="chip" data-sort="date-desc" onclick="setMjSort('date-desc')">新しい順</button>
      <button type="button" class="chip" data-sort="date-asc" onclick="setMjSort('date-asc')">古い順</button>
      <button type="button" class="chip" data-sort="point-desc" onclick="setMjSort('point-desc')">ポイントが高い順</button>
      <button type="button" class="chip" data-sort="point-asc" onclick="setMjSort('point-asc')">ポイントが低い順</button>
    </div>

    <div class="record-list" id="mj-list"></div>
  </div>

  <!-- ポーカーパネル -->
  <div class="panel" id="panel-poker">
    <div class="card">
      <h2>ポーカーの記録を追加</h2>
      <form id="form-poker">
        <label for="pk-date">日付</label>
        <input type="date" id="pk-date" required>

        <label for="pk-event">大会名</label>
        <input type="text" id="pk-event" list="pk-event-list" placeholder="例：週末トーナメント">
        <datalist id="pk-event-list"></datalist>

        <label>会場</label>
        <div class="chip-container" id="pk-venue-chips"></div>

        <label for="pk-format">形式</label>
        <select id="pk-format">
          <option value="">選択してください</option>
          <option value="MTT">MTT</option>
          <option value="SNG">SNG</option>
          <option value="リング">リング</option>
        </select>

        <label for="pk-buyin">バイイン</label>
        <input type="number" id="pk-buyin" min="0" step="1" placeholder="例：5000">

        <label for="pk-players">参加人数</label>
        <input type="number" id="pk-players" min="1" step="1" placeholder="例：24" required>

        <label for="pk-rank">順位</label>
        <input type="number" id="pk-rank" min="1" step="1" placeholder="例：3" required>

        <label for="pk-prize">プライズまたは得点ポイント</label>
        <input type="text" id="pk-prize" placeholder="例：5000円 / 120pt">

        <label for="pk-memo">メモ（特定のハンドなど）</label>
        <textarea id="pk-memo" rows="2" placeholder="自由に記入"></textarea>

        <button type="submit" class="submit-btn">記録する</button>
      </form>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="num" id="pk-stat-count">0</div>
        <div class="label">記録数</div>
      </div>
      <div class="stat-box">
        <div class="num" id="pk-stat-avg-rank">-</div>
        <div class="label">平均順位</div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="pk-search" placeholder="キーワードで検索（大会名・会場・形式・メモ）">
      <div class="search-info" id="pk-search-info"></div>
    </div>

    <div class="sort-bar" id="pk-sort-bar">
      <button type="button" class="chip" data-sort="date-desc" onclick="setPkSort('date-desc')">新しい順</button>
      <button type="button" class="chip" data-sort="date-asc" onclick="setPkSort('date-asc')">古い順</button>
      <button type="button" class="chip" data-sort="prize-desc" onclick="setPkSort('prize-desc')">プライズが高い順</button>
    </div>

    <div class="record-list" id="pk-list"></div>
  </div>

  <!-- メンバーパネル -->
  <div class="panel" id="panel-members">
    <div class="card">
      <h2>メンバーを登録</h2>
      <form id="form-member">
        <label for="member-name">名前</label>
        <input type="text" id="member-name" placeholder="例：山田さん" required>
        <button type="submit" class="submit-btn">追加する</button>
      </form>
    </div>

    <div class="card">
      <h2>登録メンバー一覧</h2>
      <div class="record-list" id="member-list"></div>
    </div>

    <div class="card">
      <h2>会場を登録</h2>
      <form id="form-venue">
        <label for="venue-name">会場名</label>
        <input type="text" id="venue-name" placeholder="例：雀荘サンライズ" required>
        <button type="submit" class="submit-btn">追加する</button>
      </form>
    </div>

    <div class="card">
      <h2>登録会場一覧</h2>
      <div class="record-list" id="venue-list"></div>
    </div>

    <div class="card">
      <h2 id="opponent-stats-heading">対戦相手別の成績（麻雀）</h2>
      <label for="opponent-stats-select">メンバーを選択</label>
      <select id="opponent-stats-select">
        <option value="">選択してください</option>
      </select>
      <div class="stats" style="margin-top:12px;">
        <div class="stat-box">
          <div class="num" id="ops-count">-</div>
          <div class="label">対局数</div>
        </div>
        <div class="stat-box">
          <div class="num" id="ops-avg-rank">-</div>
          <div class="label">平均順位</div>
        </div>
        <div class="stat-box">
          <div class="num" id="ops-top-rate">-</div>
          <div class="label">トップ率</div>
        </div>
        <div class="stat-box">
          <div class="num" id="ops-rentai-rate">-</div>
          <div class="label">連対率</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY_MJ = 'mahjongPokerRecord_mahjong';
  const STORAGE_KEY_PK = 'mahjongPokerRecord_poker';
  const STORAGE_KEY_MEMBERS = 'mahjongPokerRecord_members';
  const STORAGE_KEY_VENUES = 'mahjongPokerRecord_venues';

  // 相性判定（computeMahjongCompat）のしきい値
  const COMPAT_MIN_MATCHES = 10;    // 対戦相手として相性判定の対象にするための同卓の最低回戦数
  const COMPAT_MIN_CANDIDATES = 10; // 相性判定を発動させるための判定対象人数
  const COMPAT_TOP_N = 5;           // 好相性・苦手相性として表示する上位人数

  function loadRecords(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveRecords(key, records) {
    localStorage.setItem(key, JSON.stringify(records));
  }

  let mjRecords = loadRecords(STORAGE_KEY_MJ);
  let pkRecords = loadRecords(STORAGE_KEY_PK);
  let members = loadRecords(STORAGE_KEY_MEMBERS);
  let venues = loadRecords(STORAGE_KEY_VENUES);
  let mjSelectedOpponents = new Set();
  let mjOpponentPoints = {};
  let mjSelectedVenue = null;
  let pkSelectedVenue = null;
  let mjSortMode = 'date-desc';
  let pkSortMode = 'date-desc';

  // Date.now()だけだと同一ミリ秒内の連続追加でidが重複し、
  // 別人のチップが同じdata-idを持って連動選択されるバグの原因になるため、
  // 常に増加するユニークなidを発行する
  let lastIssuedId = 0;
  function generateId() {
    let id = Date.now();
    if (id <= lastIssuedId) id = lastIssuedId + 1;
    lastIssuedId = id;
    return id;
  }

  // 過去にDate.now()の同一ミリ秒衝突で重複idを持ってしまったメンバーをid採番し直す移行処理。
  // メンバーは全員別人なので誰も除去せず、重複していた全員に新しいidを振り直す。
  // 麻雀記録のopponents配列に入っている旧idは、どのメンバーを指すか特定できないため
  // 重複グループ内で最初に見つかったメンバーの新idに寄せる。
  function migrateDuplicateMemberIds() {
    const idCounts = {};
    members.forEach(m => { idCounts[m.id] = (idCounts[m.id] || 0) + 1; });
    const duplicateIds = Object.keys(idCounts).map(Number).filter(id => idCounts[id] > 1);
    if (duplicateIds.length === 0) return;

    const idMap = {};
    duplicateIds.forEach(oldId => {
      let isFirst = true;
      members.forEach(m => {
        if (m.id !== oldId) return;
        const newId = generateId();
        if (isFirst) {
          idMap[oldId] = newId;
          isFirst = false;
        }
        m.id = newId;
      });
    });

    mjRecords.forEach(r => {
      if (Array.isArray(r.opponents)) {
        r.opponents = r.opponents.map(id => idMap[id] !== undefined ? idMap[id] : id);
      }
    });

    saveMembers();
    saveRecords(STORAGE_KEY_MJ, mjRecords);
  }

  // 会場・大会種別・形式・バイインを追加した際、それ以前に保存された記録には
  // これらのキーが存在しない。存在しない記録にだけ空文字を補い、既存の値は一切変更しない。
  function migrateRecordFields() {
    let mjChanged = false;
    mjRecords.forEach(r => {
      if (r.venueId === undefined) { r.venueId = ''; mjChanged = true; }
      if (r.tourType === undefined) { r.tourType = ''; mjChanged = true; }
    });
    if (mjChanged) saveRecords(STORAGE_KEY_MJ, mjRecords);

    let pkChanged = false;
    pkRecords.forEach(r => {
      if (r.venueId === undefined) { r.venueId = ''; pkChanged = true; }
      if (r.format === undefined) { r.format = ''; pkChanged = true; }
      if (r.buyin === undefined) { r.buyin = ''; pkChanged = true; }
    });
    if (pkChanged) saveRecords(STORAGE_KEY_PK, pkRecords);
  }

  function switchTab(tab) {
    ['mahjong', 'poker', 'members'].forEach(t => {
      document.getElementById('tab-btn-' + t).classList.toggle('active', t === tab);
      document.getElementById('panel-' + t).classList.toggle('active', t === tab);
    });
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d)) return dateStr;
    return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
  }

  function updateEventDatalist(records, listEl) {
    const names = [...new Set(records.map(r => r.event).filter(Boolean))];
    listEl.innerHTML = names.map(n => `<option value="${escapeHtml(n)}"></option>`).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  // ---------- 麻雀：対戦相手チップ・点数入力・順位自動判定 ----------

  // 同卓10回戦以上のメンバーだけを判定対象にし、対象が10人未満なら何も判定しない。
  // 平均順位2.5未満（勝ち越し）の良いほうから上位5名、2.5より大きい（負け越し）の悪いほうから上位5名を返す。
  // ちょうど2.5の相手はどちらにも含めない。
  function computeMahjongCompat() {
    const stats = members.map(m => {
      const matches = mjRecords.filter(r => (r.opponents || []).includes(m.id));
      const avgRank = matches.length ? matches.reduce((s, r) => s + r.rank, 0) / matches.length : null;
      return { id: m.id, count: matches.length, avgRank };
    });
    const candidates = stats.filter(s => s.count >= COMPAT_MIN_MATCHES);
    if (candidates.length < COMPAT_MIN_CANDIDATES) {
      return { good: new Set(), bad: new Set() };
    }
    const winning = candidates.filter(s => s.avgRank < 2.5).sort((a, b) => a.avgRank - b.avgRank).slice(0, COMPAT_TOP_N);
    const losing = candidates.filter(s => s.avgRank > 2.5).sort((a, b) => b.avgRank - a.avgRank).slice(0, COMPAT_TOP_N);
    return { good: new Set(winning.map(s => s.id)), bad: new Set(losing.map(s => s.id)) };
  }

  function renderOpponentChips() {

      return;
    }
    const compat = computeMahjongCompat();
    container.innerHTML = members.map(m => {
      const compatClass = compat.good.has(m.id) ? ' compat-good' : compat.bad.has(m.id) ? ' compat-bad' : '';
      return `
      <button type="button" class="chip${mjSelectedOpponents.has(m.id) ? ' selected' : ''}${compatClass}" data-id="${m.id}" onclick="toggleOpponent(${m.id})">${escapeHtml(m.name)}</button>

  // 符号（±ボタン）
  function sanitizeDecimalValue(v) {
    // 全角入力を半角に正規化してからサニタイズする
    v = v.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
    v = v.replace(/[．。]/g, '.');
    v = v.replace(/[－ー―]/g, '-');
    const negative = v.charAt(0) === '-';
    let rest = v.replace(/-/g, '').replace(/[^\d.]/g, '');
    const firstDot = rest.indexOf('.');
    if (firstDot !== -1) {
      rest = rest.slice(0, firstDot + 1) + rest.slice(firstDot + 1).replace(/\./g, '');
    }
    return (negative ? '-' : '') + rest;
  }

  function toggleSignValue(v) {
    if (v === '' || v === '-') {
      return v === '' ? '-' : '';
    }
    return v.charAt(0) === '-' ? v.slice(1) : '-' + v;
  }

  function updateSignButtonState(btnEl, v) {
    if (!btnEl) return;
    btnEl.classList.toggle('sign-btn-active', v.charAt(0) === '-');
  }

  function toggleMjPointSign() {
    const el = document.getElementById('mj-point');
    const btnEl = document.getElementById('mj-point-sign-btn');

  function toggleOpponentPointSign(id) {

    const btnEl = document.getElementById('mj-opp-point-sign-' + id);
    el.value = toggleSignValue(el.value);

    updateSignButtonState(btnEl, el.value);

  // 空文字や"-"単独などparseFloatでNaNになる入力は0として扱う
  function toNum(v) {
    const n = parseFloat(v);
    return Number.isNaN(n) ? 0 : n;
  }

  // 自分と対戦相手3人ぶんの最終ポイント（ウマオカ込み）から、同点は同順位（次の順位を飛ばす）方式で順位を算出する
  function getCurrentScores() {
    const ids = [...mjSelectedOpponents];
    if (ids.length !== 3) {
      return { ready: false, message: `対戦相手を3人選択してください（現在${ids.length}人）` };
    }
    const selfVal = document.getElementById('mj-point').value;
    if (selfVal === '') {
      return { ready: false, message: '自分の最終ポイントを入力してください' };
    }
    const oppVals = ids.map(id => mjOpponentPoints[id]);
    if (oppVals.some(v => v === undefined || v === '')) {
      return { ready: false, message: '対戦相手全員の最終ポイントを入力してください' };
    }
    const selfPoint = parseFloat(selfVal);
    const opponentPoints = oppVals.map(v => parseFloat(v));
    if (Number.isNaN(selfPoint) || opponentPoints.some(v => Number.isNaN(v))) {
      return { ready: false, message: 'ポイントの入力が正しくありません' };
    }
    const allPoints = [selfPoint, ...opponentPoints];
    const rank = allPoints.filter(v => v > selfPoint).length + 1;
    return { ready: true, selfPoint, opponentIds: ids, opponentPoints, rank };
  }

  function updateRankPreview() {
    const previewEl = document.getElementById('mj-rank-preview');
    const warnEl = document.getElementById('mj-form-warning');
    const result = getCurrentScores();
    if (result.ready) {
      previewEl.textContent = `現在の順位：${result.rank}位`;
      warnEl.textContent = '';
    } else {
      previewEl.textContent = '現在の順位：-';
      warnEl.textContent = result.message;
    }
    updatePointSum();
  }

  // 自分＋選択済みの対戦相手ぶんの最終ポイントをリアルタイム合計する。
  // 4人そろっていなくても、入力済みの値だけで合計して表示する。
  function updatePointSum() {
    const sumEl = document.getElementById('mj-point-sum');
    const noteEl = document.getElementById('mj-point-sum-note');
    const selfVal = document.getElementById('mj-point').value;
    const ids = [...mjSelectedOpponents];

    let sum = 0;
    if (selfVal !== '') {
      sum += toNum(selfVal);
    }
    ids.forEach(id => {
      const val = mjOpponentPoints[id];
      if (val !== undefined && val !== '') {
        sum += toNum(val);
      }
    });

    const rounded = Math.round(sum * 10) / 10;
    sumEl.textContent = `合計：${rounded > 0 ? '+' : ''}${rounded.toFixed(1)}`;
    if (rounded === 0) {
      sumEl.classList.remove('point-sum-warn');
      noteEl.style.display = 'none';
    } else {
      sumEl.classList.add('point-sum-warn');
      noteEl.style.display = 'block';
    }
  }

  // ---------- 検索 ----------

  function mjRecordMatches(r, q) {
    const venue = venues.find(v => v.id === r.venueId);
    const oppNames = (r.opponents || []).map(id => {
      const m = members.find(mm => mm.id === id);
      return m ? m.name : '';
    });
    const fields = [r.event, venue ? venue.name : '', r.tourType, r.memo, ...oppNames];
    return fields.some(f => (f || '').toLowerCase().includes(q));
  }

  function pkRecordMatches(r, q) {
    const venue = venues.find(v => v.id === r.venueId);
    const fields = [r.event, venue ? venue.name : '', r.format, r.memo];
    return fields.some(f => (f || '').toLowerCase().includes(q));
  }

  // プライズ欄は「5000円」「120pt」のような自由記述のため、
  // 先頭の数値部分だけをparseFloatで取り出してソートに使う。数値が無い場合は最下位に回す。
  function sortPokerRecords(records, mode) {
    const arr = [...records];
    arr.sort((a, b) => {
      if (mode === 'prize-desc') {
        const av = parseFloat(a.prize);
        const bv = parseFloat(b.prize);
        const aNum = Number.isNaN(av) ? -Infinity : av;
        const bNum = Number.isNaN(bv) ? -Infinity : bv;
        if (bNum !== aNum) return bNum - aNum;
        return (b.date || '').localeCompare(a.date || '') || b.id - a.id;
      }
      if (mode === 'date-asc') {
        return (a.date || '').localeCompare(b.date || '') || a.id - b.id;
      }
      return (b.date || '').localeCompare(a.date || '') || b.id - a.id;
    });
    return arr;
  }

  // ---------- 麻雀：一覧・集計 ----------

  function groupMahjongRecords(records, sortMode) {
    const groups = {};
    records.forEach(r => {
      const key = (r.date || '') + '｜' + (r.event || '');
      if (!groups[key]) groups[key] = { date: r.date, event: r.event, items: [] };
      groups[key].items.push(r);
    });
    const groupArr = Object.values(groups);
    groupArr.forEach(g => {
      g.items.sort((a, b) => (a.round || 1) - (b.round || 1) || a.id - b.id);
      g.total = g.items.reduce((s, r) => s + r.point, 0);
      g.maxId = Math.max(...g.items.map(i => i.id));
    });
    groupArr.sort((a, b) => {
      if (sortMode === 'point-desc') return b.total - a.total;
      if (sortMode === 'point-asc') return a.total - b.total;
      if (sortMode === 'date-asc') {
        const dateCompare = (a.date || '').localeCompare(b.date || '');
        if (dateCompare !== 0) return dateCompare;
        return a.maxId - b.maxId;
      }
      const dateCompare = (b.date || '').localeCompare(a.date || '');
      if (dateCompare !== 0) return dateCompare;
      return b.maxId - a.maxId;
    });
    return groupArr;
  }

  function renderMahjong() {
    const listEl = document.getElementById('mj-list');
    const searchInput = document.getElementById('mj-search');
    const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
    const filteredRecords = query ? mjRecords.filter(r => mjRecordMatches(r, query)) : mjRecords;
    const searchInfoEl = document.getElementById('mj-search-info');
    searchInfoEl.textContent = query ? `${mjRecords.length}件中${filteredRecords.length}件を表示` : '';
    const groups = groupMahjongRecords(filteredRecords, mjSortMode);
    const compat = computeMahjongCompat();

    document.querySelectorAll('#mj-sort-bar .chip').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.sort === mjSortMode);
    });

    if (groups.length === 0) {
      listEl.innerHTML = `<div class="empty-msg">${query ? '該当する記録がありません' : 'まだ記録がありません'}</div>`;
    } else {
      listEl.innerHTML = groups.map(g => {
        const total = g.total;
        const avgRank = g.items.reduce((s, r) => s + r.rank, 0) / g.items.length;
        const itemsHtml = g.items.map(r => {
          const oppHtml = (r.opponents || [])
            .map(id => {
              const m = members.find(mm => mm.id === id);
              if (!m) return null;
              const cls = compat.good.has(id) ? ' class="compat-good"' : compat.bad.has(id) ? ' class="compat-bad"' : '';
              return `<span${cls}>${escapeHtml(m.name)}</span>`;
            })
            .filter(Boolean);
          const venue = venues.find(v => v.id === r.venueId);
          const venueTypeLine = [venue ? venue.name : '', r.tourType || ''].filter(Boolean).join(' ／ ');
          return `
            <div class="round-row">
              <div class="main-line"><span class="rank-badge">${r.rank}位</span>第${r.round || 1}回戦　${r.point >= 0 ? '+' : ''}${r.point}pt</div>
              ${venueTypeLine ? `<div class="sub-line">${escapeHtml(venueTypeLine)}</div>` : ''}
              ${oppHtml.length ? `<div class="sub-line">対戦相手：${oppHtml.join('、')}</div>` : ''}
              ${r.memo ? `<div class="memo-line">${escapeHtml(r.memo)}</div>` : ''}
              <button class="del-btn" onclick="deleteMahjong(${r.id})">削除</button>
            </div>
          `;
        }).join('');
        return `
          <div class="group-card">
            <div class="group-header">
              <span>${formatDate(g.date)}　${escapeHtml(g.event || '（大会名なし）')}</span>
              <span>計 ${total >= 0 ? '+' : ''}${total.toFixed(1)}pt ／ 平均${avgRank.toFixed(2)}位</span>
            </div>
            ${itemsHtml}
          </div>
        `;
      }).join('');
    }

    document.getElementById('mj-stat-count').textContent = filteredRecords.length;
    if (filteredRecords.length > 0) {
      const avgRank = filteredRecords.reduce((s, r) => s + r.rank, 0) / filteredRecords.length;
      const avgPoint = filteredRecords.reduce((s, r) => s + r.point, 0) / filteredRecords.length;
      const topRate = filteredRecords.filter(r => r.rank === 1).length / filteredRecords.length * 100;
      const rentaiRate = filteredRecords.filter(r => r.rank === 1 || r.rank === 2).length / filteredRecords.length * 100;
      document.getElementById('mj-stat-avg-rank').textContent = avgRank.toFixed(2);
      document.getElementById('mj-stat-avg-point').textContent = (avgPoint >= 0 ? '+' : '') + avgPoint.toFixed(1);
      document.getElementById('mj-stat-top-rate').textContent = topRate.toFixed(1) + '%';
      document.getElementById('mj-stat-rentai-rate').textContent = rentaiRate.toFixed(1) + '%';
    } else {
      document.getElementById('mj-stat-avg-rank').textContent = '-';
      document.getElementById('mj-stat-avg-point').textContent = '-';
      document.getElementById('mj-stat-top-rate').textContent = '-';
      document.getElementById('mj-stat-rentai-rate').textContent = '-';
    }

    updateEventDatalist(mjRecords, document.getElementById('mj-event-list'));
  }

  function renderPoker() {
    const listEl = document.getElementById('pk-list');
    const searchInput = document.getElementById('pk-search');
    const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
    const filteredRecords = query ? pkRecords.filter(r => pkRecordMatches(r, query)) : pkRecords;

    const sorted = sortPokerRecords(filteredRecords, pkSortMode);

    });

    } else {

          .filter(Boolean).join(' ／ ');
        return `
        <div class="record-item">
          <div class="record-info">
            <div class="main-line"><span class="rank-badge">${r.rank}位</span>${formatDate(r.date)}（${r.players}人参加）</div>
            <div class="sub-line">${escapeHtml(r.event || '（大会名なし）')}${r.prize ? ' ／ ' + escapeHtml(r.prize) : ''}</div>
            ${extraLine ? `<div class="sub-line">${escapeHtml(extraLine)}</div>` : ''}
            ${r.memo ? `<div class="memo-line">${escapeHtml(r.memo)}</div>` : ''}
          </div>
          <button class="del-btn" onclick="deletePoker(${r.id})">削除</button>
        </div>
      `;
      }).join('');
    }

    document.getElementById('pk-stat-count').textContent = filteredRecords.length;

      const avgRank = filteredRecords.reduce((s, r) => s + r.rank, 0) / filteredRecords.length;

    } else {
      document.getElementById('pk-stat-avg-rank').textContent = '-';
    }

    updateEventDatalist(pkRecords, document.getElementById('pk-event-list'));
  }

  function deleteMahjong(id) {

  }

  function deletePoker(id) {
    pkRecords = pkRecords.filter(r => r.id !== id);
    saveRecords(STORAGE_KEY_PK, pkRecords);
    renderPoker();
  }

  document.getElementById('mj-point').addEventListener('input', function () {
    this.value = sanitizeDecimalValue(this.value);
    updateSignButtonState(document.getElementById('mj-point-sign-btn'), this.value);
    updateRankPreview();
  });
  document.getElementById('mj-search').addEventListener('input', renderMahjong);
  document.getElementById('pk-search').addEventListener('input', renderPoker);

  document.getElementById('form-mahjong').addEventListener('submit', function (e) {
    e.preventDefault();
    const date = document.getElementById('mj-date').value;
    const event = document.getElementById('mj-event').value.trim();
    const tourType = document.getElementById('mj-tour-type').value;
    const round = parseInt(document.getElementById('mj-round').value, 10) || 1;
    const memo = document.getElementById('mj-memo').value.trim();
    if (!date) return;

    const result = getCurrentScores();
    if (!result.ready) {
      updateRankPreview();
      return;
    }

    mjRecords.push({
      id: generateId(),
      date, event, round,
      rank: result.rank,
      point: result.selfPoint,
      opponents: result.opponentIds,
      opponentPoints: result.opponentPoints,
      venueId: mjSelectedVenue !== null ? mjSelectedVenue : '',
      tourType,
      memo
    });
    saveRecords(STORAGE_KEY_MJ, mjRecords);

    // 日付・大会名・対戦相手は次の回戦のために残し、回戦番号と点数だけリセットする
    document.getElementById('mj-round').value = round + 1;
    document.getElementById('mj-point').value = '';
    updateSignButtonState(document.getElementById('mj-point-sign-btn'), '');
    document.getElementById('mj-memo').value = '';
    mjOpponentPoints = {};
    renderOpponentPointInputs();
    renderOpponentChips();

    renderMahjong();
  });

  document.getElementById('form-poker').addEventListener('submit', function (e) {
    e.preventDefault();
    const date = document.getElementById('pk-date').value;
    const event = document.getElementById('pk-event').value.trim();
    const format = document.getElementById('pk-format').value;
    const buyinRaw = document.getElementById('pk-buyin').value;
    const buyin = buyinRaw !== '' ? parseFloat(buyinRaw) : '';
    const players = parseInt(document.getElementById('pk-players').value, 10);
    const rank = parseInt(document.getElementById('pk-rank').value, 10);
    const prize = document.getElementById('pk-prize').value.trim();
    const memo = document.getElementById('pk-memo').value.trim();
    if (!date || !players || !rank) return;

    pkRecords.push({
      id: generateId(),
      date, event, players, rank, prize, memo,
      venueId: pkSelectedVenue !== null ? pkSelectedVenue : '',
      format,
      buyin
    });
    saveRecords(STORAGE_KEY_PK, pkRecords);
    this.reset();
    pkSelectedVenue = null;
    renderVenueChips('pk-venue-chips', pkSelectedVenue, 'togglePkVenue');
    renderPoker();
  });

  migrateDuplicateMemberIds();
  migrateRecordFields();
  renderMembers();
  renderVenues();
  renderMahjong();
  renderPoker();
</script>
</body>
</html>
